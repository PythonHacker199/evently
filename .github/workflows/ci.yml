name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install
        run: npm run setup

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Server tests
        run: npm test

      - name: Web tests
        run: npm run test:web

      - name: Build the Evently page
        run: npm run build
